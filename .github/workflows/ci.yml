name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装核心依赖：调制机制、指标与统计检验都不需要 torch，
      # 因此 CI 不必为 110 MB 的 torch wheel 付代价。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib pyyaml ruff pytest

      - name: Lint
        run: ruff check baff tests experiments

      - name: 单元测试
        run: pytest tests -q

  torch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 CPU 版 torch
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: 回测冒烟测试
        run: pytest tests -q -m torch
